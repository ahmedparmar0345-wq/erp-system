databases:
  - name: erp-db
    databaseName: erp
    plan: free

services:
  - type: web
    name: erp-backend
    env: node
    rootDir: erp-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: require

  - type: web
    name: erp-frontend
    env: static
    rootDir: erp-frontend
    buildCommand: npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: erp-backend
          type: web
          property: host
